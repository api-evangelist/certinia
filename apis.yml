apis:
- aid: certinia:certinia-revenue-management-api
  name: Certinia Revenue Management API
  tags:
  - Revenue Recognition
  - ASC 606
  - IFRS 15
  - Revenue Contracts
  - Deferred Revenue
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://help.certinia.com/TechnicalReference/2024.2/RevenueManagement/Apex/GenericAPI.htm
  properties:
  - url: https://help.certinia.com/TechnicalReference/2024.2/RevenueManagement/Apex/GenericAPI.htm
    type: Documentation
  - url: https://help.certinia.com/main/2024.1/Content/RevenueManagement/Features/RevenueContracts/CreateRevContractUsingAPI.htm
    type: APIReference
  description: Global Apex service classes for automating revenue recognition to ASC 606
    and IFRS 15. RevenueContractService creates and updates revenue contracts,
    generates performance obligations, allocates revenue, and produces recognition
    schedules. RevenueRecognitionService, RevenueScheduleService, and
    RevenueScheduleAutomationService recognize revenue and cost against schedules,
    and ForecastService supports revenue forecasting. Invoked as Apex within a
    Salesforce org (namespace prefix used in class names, e.g. CODAAPI); endpoints
    modeled from the public developer reference, not a public HTTP base URL.
- aid: certinia:certinia-billing-central-api
  name: Certinia Billing Central API
  tags:
  - Billing
  - Subscription Billing
  - Invoicing
  - Billing Documents
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://help.certinia.com/ffbc-api/3X/GenericAPI.htm
  properties:
  - url: https://help.certinia.com/ffbc-api/3X/GenericAPI.htm
    type: Documentation
  description: Global Apex service classes for subscription and usage billing.
    BillingService, BillingDocumentsService, BillingSchedulesService, and
    ContractsService generate billing documents and schedules, manage contracts,
    pricing, discounts, products, and tax codes, and drive the bill-to-cash process.
    Invoked as Apex within a Salesforce org against Billing Central managed-package
    objects; endpoints modeled from the public developer reference.
