name: Certinia
kind: company
description: Certinia (formerly FinancialForce) is a Salesforce-native ERP, Professional
  Services Automation (PSA), and revenue-management suite delivered as managed
  packages that run inside a customer's Salesforce org. Its programmatic surface is
  not a standalone public REST product; it is a set of global Apex service classes
  (and legacy SOAP APIs) - Revenue Management, Billing Central, PSA, Accounting/ERP,
  Supply Chain, and Services CPQ - invoked on the Salesforce platform against
  Certinia managed-package objects. Certinia automates revenue recognition to ASC 606
  and IFRS 15, subscription billing, project and resource management, and
  accounting. Access is gated - it requires a provisioned Salesforce org with the
  relevant Certinia managed package installed and the appropriate permission set or
  profile assigned. The endpoints documented here are modeled from Certinia's public
  Apex API developer references; they are not called against a public, unauthenticated
  HTTP base URL.
