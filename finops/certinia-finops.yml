description: >-
  FinOps view of Certinia spend. Certinia (formerly FinancialForce) is licensed as
  a per-user, per-month subscription by module (ERP / Accounting, PSA, Revenue
  Management, Billing Central, Supply Chain, Services CPQ) on an annual or
  multi-year contract. Because Certinia runs as managed packages inside the
  customer's Salesforce org, total cost of ownership has three layers: the Certinia
  subscription, the underlying Salesforce Platform licensing the apps require, and
  implementation / integration services. There is no separate per-call API charge -
  Apex/SOAP API access is included with the licensed managed package - so API cost
  management is really about license (seat) optimization and Salesforce Platform
  consumption, not per-request metering.
notes: >-
  Per-unit rates are quote-based and not published by Certinia; the ranges in the
  plans file are market-observed, not official. The dominant, recurring costs are
  named-user subscriptions (Certinia + Salesforce) rather than usage metering.
  Verify all figures directly with Certinia during reconciliation.
