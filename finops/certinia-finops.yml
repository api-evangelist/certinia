meters:
- name: named_users
  description: Per-user, per-month subscription seats by Certinia module - the primary cost driver.
  unit: users
  aggregation: sum
  dimensions:
  - module
  - org
- name: salesforce_platform_licenses
  description: Underlying Salesforce Platform licenses required to run the Certinia managed packages.
  unit: users
  aggregation: sum
  dimensions:
  - org
- name: implementation_services
  description: One-time and ongoing implementation, configuration, and integration services.
  unit: hours
  aggregation: sum
  dimensions:
  - project
principles:
- name: Visibility
  description: Track Certinia seat counts per module alongside the Salesforce Platform licenses they depend on; API access carries no separate meter.
- name: Allocation
  description: Map named-user seats (PSA, ERP, Revenue, Billing) to teams and cost centers; allocate Salesforce Platform fees that Certinia consumes.
- name: Optimization
  description: Right-size named-user counts, consolidate modules, and negotiate multi-year volume discounts; reduce Salesforce API/governor pressure by bulkifying integrations rather than paying per call.
- name: Accountability
  description: Assign module owners; review seat utilization and contract renewals annually against actual usage.
